# X06 : hôte d'images « tiers » interne au banc (aucune dépendance à Internet).
# app-casse le joint par l'alias réseau images.cobaye.test quand /_image transforme une image distante.
server {
  listen 80;
  server_name images.cobaye.test;
  root /srv/images;
  location / { try_files $uri =404; }
}
