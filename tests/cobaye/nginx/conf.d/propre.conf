proxy_cache_path /var/cache/nginx/images levels=1:2 keys_zone=images:10m max_size=200m inactive=7d use_temp_path=off;
server {
  listen 80 default_server;
  server_name propre.cobaye.test;
  return 301 https://$host$request_uri;
}
server {
  listen 443 ssl default_server;
  server_name propre.cobaye.test;
  ssl_certificate /etc/nginx/certs/cobaye.crt;
  ssl_certificate_key /etc/nginx/certs/cobaye.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  server_tokens off;
  gzip on;
  gzip_comp_level 6;
  gzip_min_length 512;
  gzip_types text/css application/javascript application/json application/xml text/xml text/plain image/svg+xml;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
  location ~ /\.(?!well-known) { return 404; }
  location ~* \.map$ { return 404; }
  location /_image {
    proxy_pass http://app-propre:4321;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_cache images;
    proxy_cache_valid 200 7d;
  }
  location / {
    proxy_pass http://app-propre:4321;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
  }
}
