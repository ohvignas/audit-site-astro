map $http_user_agent $bloque_ia {
  default 0;
  ~*(ClaudeBot|Claude-SearchBot) 1;   # G02
}
server {
  listen 80;
  server_name casse.cobaye.test;
  return 302 https://$host$request_uri;   # H07 : 302 au lieu de 301
}
server {
  listen 443 ssl;
  server_name casse.cobaye.test;
  ssl_certificate /etc/nginx/certs/cobaye.crt;
  ssl_certificate_key /etc/nginx/certs/cobaye.key;
  server_tokens on;                                   # H05
  gzip off;                                           # H01, P16
  # H02, H03, H04 : aucun en-tête de sécurité
  if ($bloque_ia) { return 403; }
  location = /.env { root /srv/leurres; default_type text/plain; }        # X01
  location = /.git/HEAD { alias /srv/leurres/git-HEAD; default_type text/plain; }   # X07 (git-HEAD : un dossier .git imbriqué n'est pas versionnable)
  location /_astro/ {
    proxy_pass http://app-casse:4321;
    proxy_set_header Host $host;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "no-cache" always;       # H06
    add_header X-Powered-By "Express/4.18.2" always;
    add_header Access-Control-Allow-Origin $http_origin always;
  }
  location / {
    proxy_pass http://app-casse:4321;
    proxy_set_header Host $host;                      # S02, S20 : pas de X-Forwarded-* et pas de security.allowedDomains (C12) → Astro voit http://
    add_header X-Powered-By "Express/4.18.2" always;  # H05
    add_header Access-Control-Allow-Origin $http_origin always;   # X04
    # H12 : aucun cache pour /_image
    add_header Set-Cookie "session_cobaye=factice; Path=/" always;   # X09 : cookie de session sans Secure, SameSite ni HttpOnly
    # X10, X11 : CSP en <meta> seulement (comme security.csp d'Astro >= 6), unsafe-inline sans hash, frame-ancestors ignoré.
    # Injectée par nginx : aucune chaîne « Content-Security-Policy » dans src/ (C13 reste détecté par le scan de code).
    proxy_set_header Accept-Encoding "";
    sub_filter '<head>' "<head><meta http-equiv=\"Content-Security-Policy\" content=\"script-src 'self' 'unsafe-inline' https:; frame-ancestors 'none'\">";
    sub_filter_once on;
  }
}
